extends: ../mirror-base.yml
name: powershell
target:
  registry: ghcr.io
  repository: ocx-contrib/powershell/powershell
source:
  type: github_release
  owner: PowerShell
  repo: PowerShell
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
assets:
  "linux/amd64+libc.glibc":
    - "^powershell-.*-linux-x64\\.tar\\.gz$"
asset_type:
  type: archive
  strip_components: 0
metadata:
  default: metadata.json
catalog:
  logo: logo.svg
versions:
  min: "7.6.0"
  new_per_run: 5
platforms:
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
tests:
  - name: smoke
    script: powershell/tests/smoke.star
annotations:
  org.opencontainers.image.licenses: "MIT"
announce:
  package: powershell/powershell
  fork: ocx-contrib/index
