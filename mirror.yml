name: pwsh
target:
  registry: ocx.sh
  repository: pwsh

source:
  type: github_release
  owner: PowerShell
  repo: PowerShell
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# Pass 1 — Linux only. darwin/windows staged below for Pass 2/3.
assets:
  # linux/amd64 uses Microsoft's glibc linux-x64 build: it targets the standard
  # /lib64/ld-linux-x86-64.so.2 loader present on the glibc ubuntu-latest runner.
  # The musl-x64 build was rejected — it embeds PT_INTERP /lib/ld-musl-x86_64.so.1,
  # which is absent on glibc hosts, so exec fails (surfaced as E2BIG by the runner).
  # The anchored -linux-x64\.tar\.gz$ tail excludes the -fxdependent and -noopt
  # variants, the .pkg / .msi installers, and the .sha256 sidecars. Upstream ships
  # no linux-arm64 glibc-portable single-file build matching this contract, so
  # linux/arm64 is not mirrored — see the skipped-platforms note in the bootstrap commit.
  linux/amd64:
    - "^powershell-.*-linux-x64\\.tar\\.gz$"
  darwin/amd64:
    - "^powershell-.*-osx-x64\\.tar\\.gz$"
  darwin/arm64:
    - "^powershell-.*-osx-arm64\\.tar\\.gz$"
  # .zip only — exclude the win-x86 / win-fxdependent zips, the .msi installers,
  # and the .msixbundle Store package. The PowerShell-<v>-win-<arch>.zip is a
  # self-contained payload (pwsh.exe + sibling DLLs) flat at the archive root.
  windows/amd64:
    - "^PowerShell-.*-win-x64\\.zip$"
  windows/arm64:
    - "^PowerShell-.*-win-arm64\\.zip$"

asset_type:
  type: archive
  strip_components: 0   # tarball/zip extracts pwsh(.exe) + *.dll/*.so FLAT at the archive root

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "7.6.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  darwin/amd64:
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
